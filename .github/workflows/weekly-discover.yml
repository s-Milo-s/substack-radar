name: weekly-discover
on:
  schedule:
    - cron: "43 16 * * 0"   # Sundays ~8:43am PT
  workflow_dispatch: {}

permissions:
  contents: write   # to commit state.json back

# Both workflows commit state.json, so they share one group and queue behind each other
# instead of running at the same time. Never cancel a run mid-commit.
concurrency:
  group: radar-state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - name: HTTP cache (keeps us polite to Substack across runs)
        uses: actions/cache@v4
        with:
          path: .cache
          key: radar-http-${{ github.run_id }}
          restore-keys: radar-http-
      - run: python -m radar discover
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      - name: Persist state
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet && exit 0
          git commit -m "radar: discovery state"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
